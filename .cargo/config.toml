# why: link Microsoft's C runtime into the exe. Without it Adelite needs VCRUNTIME140.dll from the
# Visual C++ Redistributable, which a fresh Windows does not have, and there it does not even start.
# (TDLib's DLLs still need it: the release workflow ships Microsoft's runtime DLLs beside them.)
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
